name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel / PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Prepare temporary environment
        shell: bash
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          cp apps/backend/.env.example apps/backend/.env
          docker compose config --quiet

      - name: Build PHP image
        run: docker compose build backend

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 database

      - name: Install locked dependencies
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -e COMPOSER_HOME=/tmp/composer \
            backend composer install \
            --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            backend php artisan key:generate

      - name: Create testing database
        run: |
          docker compose exec -T database \
            createdb -U salesflow salesflow_testing

      - name: Check formatting
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            backend ./vendor/bin/pint --test

      - name: Run tests
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            backend php artisan test

      - name: Audit Composer dependencies
        run: |
          docker compose run --rm --no-deps \
            --user "$(id -u):$(id -g)" \
            -e COMPOSER_HOME=/tmp/composer \
            backend composer audit

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=80 database

      - name: Clean up CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans